<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Reader on PC</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --fg: #1d2129; --muted: #6b7280;
    --border: #dde1e6; --accent: #2563eb; --accent-fg: #ffffff; --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1e2127; --fg: #e8eaed; --muted: #9aa0a6;
      --border: #33373e; --accent: #4f8cff; --accent-fg: #0b0d10; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  /* PC: 左に読み込み、右に生成を並べる */
  .app-header { max-width: 1280px; margin: 0 auto; padding: 16px 16px 0; }
  h1 { font-size: 1.3rem; margin: 8px 0 16px; }
  .panes {
    max-width: 1280px; margin: 0 auto; padding: 0 16px 16px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start;
  }
  .tabs { display: none; }
  /* スマホ: 2つのペインを横に並べ、横スワイプで切り替える（各ペインは縦に個別スクロール） */
  @media (max-width: 899px) {
    body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .app-header { width: 100%; padding: 8px 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.1rem; margin: 4px 0 8px; }
    .tabs {
      display: flex; position: relative; padding: 3px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--border);
    }
    .tabs button {
      flex: 1; position: relative; z-index: 1; border: none; background: transparent;
      padding: 6px 12px; color: var(--muted); transition: color .2s;
    }
    .tabs button[aria-pressed="true"] { color: var(--accent-fg); }
    .tab-indicator {
      position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
      border-radius: 8px; background: var(--accent);
    }
    .panes {
      flex: 1; min-height: 0; max-width: none; width: 100%; padding: 0; gap: 0;
      display: flex; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
    }
    .panes::-webkit-scrollbar { display: none; }
    .pane {
      flex: 0 0 100%; min-width: 0; overflow-y: auto; overscroll-behavior-y: contain;
      scroll-snap-align: start; scroll-snap-stop: always; padding: 12px 16px 16px;
    }
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  select, button {
    font: inherit; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--fg);
  }
  select { flex: 1 1 200px; min-width: 0; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  label.check { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
  .viewport {
    position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000;
    border-radius: 8px; overflow: hidden; display: grid; place-items: center;
  }
  .viewport video { width: 100%; height: 100%; object-fit: contain; }
  .viewport .placeholder { position: absolute; color: #aaa; text-align: center; padding: 16px; font-size: .95rem; }
  .viewport.hit { outline: 4px solid var(--ok); outline-offset: -4px; }
  #status { font-size: .85rem; color: var(--muted); margin-top: 8px; min-height: 1.2em; }
  .result-text {
    font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 8px 0 12px;
    max-height: 240px; overflow: auto;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .toast { color: var(--ok); font-size: .9rem; align-self: center; }
  h2 { font-size: 1rem; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  ul.history { list-style: none; margin: 0; padding: 0; }
  ul.history li {
    display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border);
  }
  ul.history li:first-child { border-top: none; }
  ul.history .pick { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; cursor: pointer; user-select: none; }
  ul.history .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
  ul.history .time { color: var(--muted); font-size: .75rem; white-space: nowrap; }
  ul.history button { padding: 4px 8px; font-size: .8rem; }
  .hint { font-size: .85rem; color: var(--muted); }
  .drop { border: 2px dashed var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  .drop.over { border-color: var(--accent); }
  textarea {
    width: 100%; font: inherit; padding: 8px 12px; border-radius: 8px; resize: vertical;
    border: 1px solid var(--border); background: var(--card); color: var(--fg); margin-bottom: 8px;
  }
  label.check select { flex: none; padding: 4px 8px; }
  input[type="number"] {
    width: 6em; font: inherit; padding: 4px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--fg);
  }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-bottom: 12px; }
  .pager span { font-size: .9rem; color: var(--muted); text-align: center; min-width: 9em; }
  .history-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .history-tools button { padding: 4px 8px; font-size: .85rem; }
  .gen-image { display: grid; place-items: center; margin-bottom: 12px; }
  .gen-image canvas { width: min(100%, 280px); height: auto; image-rendering: pixelated; border-radius: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="app-header">
  <h1>QR Reader on PC</h1>
  <nav class="tabs" id="tabs" aria-label="画面の切り替え">
    <span class="tab-indicator" id="tabIndicator"></span>
    <button type="button" data-pane="0" aria-controls="paneRead" aria-pressed="true">読み込み</button>
    <button type="button" data-pane="1" aria-controls="paneGen" aria-pressed="false">生成</button>
  </nav>
</header>
<main class="panes" id="panes">
 <div class="pane" id="paneRead" aria-label="読み込み">
  <section class="card">
    <div class="controls">
      <button id="toggle" class="primary">カメラを起動</button>
      <select id="cameras" aria-label="カメラ選択"><option value="">カメラ（起動後に選択可）</option></select>
      <label class="check"><input type="checkbox" id="autoCopy" checked> 読み取ったら自動でコピー</label>
      <label class="check"><input type="checkbox" id="mirror"> 左右反転表示</label>
    </div>
    <div class="viewport" id="viewport">
      <video id="video" playsinline muted></video>
      <div class="placeholder" id="placeholder">「カメラを起動」を押して、QRコードをカメラにかざしてください</div>
    </div>
    <div id="status"></div>
  </section>

  <section class="card" id="resultCard" hidden>
    <h2>読み取り結果</h2>
    <div class="result-text" id="resultText"></div>
    <div class="actions">
      <button id="copyBtn">コピー</button>
      <button id="openBtn" class="primary" hidden>URLを開く</button>
      <span class="toast" id="toast"></span>
    </div>
  </section>

  <section class="card">
    <h2>画像から読み取る</h2>
    <div class="drop" id="drop">
      <p class="hint">画像ファイルをここにドロップ、<b>Ctrl+V</b> でスクリーンショットを貼り付け、または
        <label><input type="file" id="file" accept="image/*"></label></p>
    </div>
  </section>

  <section class="card">
    <h2>履歴 <button id="clearHistory">履歴を消去</button></h2>
    <div class="history-tools" id="historyTools" hidden>
      <button id="joinCopy" class="primary" disabled>選択した項目を結合してコピー</button>
      <button id="selectAll">すべて選択</button>
      <span class="hint">読み取った順に結合します（Shift+クリックで範囲選択）</span>
    </div>
    <ul class="history" id="history"></ul>
    <p class="hint" id="historyEmpty">まだ履歴はありません</p>
  </section>
 </div>

 <div class="pane" id="paneGen" aria-label="生成">
  <section class="card">
    <h2>QRコードを作る</h2>
    <textarea id="genInput" rows="3" placeholder="QRコードにしたい文字列やURLを入力"></textarea>
    <div class="controls">
      <label class="check">サイズ
        <select id="genSize">
          <option value="256">小</option>
          <option value="512" selected>中</option>
          <option value="1024">大</option>
        </select>
      </label>
      <label class="check">誤り訂正
        <select id="genLevel">
          <option value="L">L（7%）</option>
          <option value="M" selected>M（15%）</option>
          <option value="Q">Q（25%）</option>
          <option value="H">H（30%）</option>
        </select>
      </label>
    </div>
    <div class="controls">
      <label class="check"><input type="checkbox" id="genAnimate" checked> 貼り付けたときに1文字ずつ組み立てるアニメーション</label>
      <label class="check"><input type="checkbox" id="genAnimateOnOption"> サイズ・誤り訂正レベルの変更時もアニメーション</label>
    </div>
    <div class="controls">
      <label class="check"><input type="checkbox" id="genSplit"> 長い文字列を分割する</label>
      <label class="check"><input type="number" id="genChunk" min="1" step="1" value="500" aria-label="1枚あたりの文字数"> 文字ごと</label>
    </div>
    <div id="genOutput" hidden>
      <div class="pager" id="genPager" hidden>
        <button id="genPrev" title="← キーでも戻れます">← 前へ</button>
        <span id="genPage"></span>
        <button id="genNext" class="primary" title="→ キーでも進めます">次へ →</button>
      </div>
      <div class="gen-image"><canvas id="genCanvas" role="img" aria-label="生成したQRコード"></canvas></div>
      <div class="actions">
        <button id="genDownload" class="primary">PNGで保存</button>
        <button id="genCopy">画像をコピー</button>
        <span class="toast" id="genToast"></span>
      </div>
    </div>
    <p class="hint" id="genMessage"></p>
  </section>
 </div>
</main>

<script src="vendor/jsQR.js"></script>
<script src="vendor/qrcode-generator.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const video = $('video'), viewport = $('viewport'), placeholder = $('placeholder');
  const toggleBtn = $('toggle'), cameraSel = $('cameras'), statusEl = $('status');
  const resultCard = $('resultCard'), resultText = $('resultText');
  const copyBtn = $('copyBtn'), openBtn = $('openBtn'), toast = $('toast');
  const autoCopy = $('autoCopy'), mirror = $('mirror');
  const genAnimate = $('genAnimate'), genAnimateOnOption = $('genAnimateOnOption');
  const genSplit = $('genSplit'), genChunk = $('genChunk');
  const historyEl = $('history'), historyEmpty = $('historyEmpty');

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const HISTORY_KEY = 'qr-reader-history';
  const SETTINGS_KEY = 'qr-reader-settings';
  const DUP_WINDOW_MS = 3000;

  let stream = null, scanTimer = null, detector = null;
  let lastText = '', lastTime = 0, currentText = '';

  // ---- 設定の保存（失敗しても動作に影響しない） ----
  function loadJSON(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ignore */ }
  }
  const settings = loadJSON(SETTINGS_KEY, {});
  if (typeof settings.autoCopy === 'boolean') autoCopy.checked = settings.autoCopy;
  if (typeof settings.mirror === 'boolean') mirror.checked = settings.mirror;
  if (typeof settings.genAnimate === 'boolean') genAnimate.checked = settings.genAnimate;
  if (typeof settings.genAnimateOnOption === 'boolean') genAnimateOnOption.checked = settings.genAnimateOnOption;
  if (typeof settings.genSplit === 'boolean') genSplit.checked = settings.genSplit;
  if (Number.isInteger(settings.genChunk) && settings.genChunk > 0) genChunk.value = settings.genChunk;
  let activePane = settings.pane === 1 ? 1 : 0; // スマホで表示中の画面（0: 読み込み, 1: 生成）
  const persistSettings = () => saveJSON(SETTINGS_KEY, {
    autoCopy: autoCopy.checked, mirror: mirror.checked,
    genAnimate: genAnimate.checked, genAnimateOnOption: genAnimateOnOption.checked,
    genSplit: genSplit.checked, genChunk: chunkSize(),
    deviceId: cameraSel.value || settings.deviceId,
    pane: activePane,
  });
  autoCopy.addEventListener('change', persistSettings);
  mirror.addEventListener('change', () => { applyMirror(); persistSettings(); });
  function applyMirror() { video.style.transform = mirror.checked ? 'scaleX(-1)' : ''; }
  applyMirror();

  // ---- 画面の切り替え（スマホ: 横スワイプ / 上のボタン。PC では左右に並ぶので使わない） ----
  const panes = $('panes'), tabIndicator = $('tabIndicator');
  const tabButtons = [...document.querySelectorAll('#tabs button')];
  function syncTabs() {
    const w = panes.clientWidth;
    const progress = w ? Math.min(1, Math.max(0, panes.scrollLeft / w)) : 0;
    tabIndicator.style.transform = `translateX(${progress * 100}%)`;
    const next = Math.round(progress);
    if (panes.scrollWidth <= w + 1 || next === activePane) return; // PC 表示中は横スクロールしない
    activePane = next;
    tabButtons.forEach((b, i) => b.setAttribute('aria-pressed', String(i === activePane)));
    persistSettings();
  }
  let syncFrame = 0;
  panes.addEventListener('scroll', () => {
    cancelAnimationFrame(syncFrame);
    syncFrame = requestAnimationFrame(syncTabs);
  }, { passive: true });
  tabButtons.forEach((b, i) => b.addEventListener('click', () => {
    panes.scrollTo({ left: i * panes.clientWidth, behavior: 'smooth' });
  }));
  // 画面の回転などで幅が変わっても、表示中の画面がずれないようにする
  function alignPane() {
    panes.scrollLeft = activePane * panes.clientWidth;
    tabIndicator.style.transform = `translateX(${activePane * 100}%)`;
    tabButtons.forEach((b, i) => b.setAttribute('aria-pressed', String(i === activePane)));
  }
  new ResizeObserver(alignPane).observe(panes);

  // ---- デコーダ（BarcodeDetector があれば優先、なければ jsQR） ----
  async function initDetector() {
    if ('BarcodeDetector' in window) {
      try {
        const formats = await BarcodeDetector.getSupportedFormats();
        if (formats.includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch { detector = null; }
    }
  }

  async function decodeSource(source, width, height) {
    if (detector) {
      try {
        const codes = await detector.detect(source);
        if (codes.length) return codes[0].rawValue;
      } catch { /* jsQR にフォールバック */ }
    }
    canvas.width = width; canvas.height = height;
    ctx.drawImage(source, 0, 0, width, height);
    const img = ctx.getImageData(0, 0, width, height);
    const code = jsQR(img.data, width, height, { inversionAttempts: 'attemptBoth' });
    return code ? code.data : null;
  }

  // ---- カメラ ----
  async function listCameras() {
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const current = stream?.getVideoTracks()[0]?.getSettings().deviceId;
    cameraSel.innerHTML = '';
    devices.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `カメラ ${i + 1}`;
      if (d.deviceId === current) opt.selected = true;
      cameraSel.appendChild(opt);
    });
  }

  async function startCamera(deviceId) {
    stopCamera();
    if (!navigator.mediaDevices?.getUserMedia) {
      setStatus('このブラウザではカメラを使えません。Chrome / Edge / Firefox の最新版でお試しください。');
      return;
    }
    const video_ = deviceId
      ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
      : { width: { ideal: 1280 }, height: { ideal: 720 } };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: video_, audio: false });
    } catch (e) {
      if (deviceId) return startCamera(null); // 保存済みカメラが無くなっていた場合
      setStatus(cameraErrorMessage(e));
      return;
    }
    video.srcObject = stream;
    await video.play();
    placeholder.hidden = true;
    toggleBtn.textContent = 'カメラを停止';
    toggleBtn.classList.remove('primary');
    await listCameras();
    persistSettings();
    setStatus('');
    scanLoop();
  }

  function stopCamera() {
    clearTimeout(scanTimer);
    scanTimer = null;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
    placeholder.hidden = false;
    toggleBtn.textContent = 'カメラを起動';
    toggleBtn.classList.add('primary');
  }

  function cameraErrorMessage(e) {
    switch (e && e.name) {
      case 'NotAllowedError': return 'カメラの使用が許可されませんでした。アドレスバーのカメラアイコンから許可してください。';
      case 'NotFoundError': return 'カメラが見つかりません。接続を確認してください。';
      case 'NotReadableError': return 'カメラを開けません。他のアプリ（Zoom / Teams など）が使用中かもしれません。';
      default: return 'カメラを起動できませんでした: ' + (e && e.message || e);
    }
  }

  async function scanLoop() {
    if (!stream) return;
    if (video.readyState >= 2 && video.videoWidth) {
      // 処理を軽くするため長辺 800px 程度に縮小して解析
      const scale = Math.min(1, 800 / Math.max(video.videoWidth, video.videoHeight));
      const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
      const text = await decodeSource(video, w, h);
      if (text) handleResult(text);
    }
    if (stream) scanTimer = setTimeout(scanLoop, 150);
  }

  toggleBtn.addEventListener('click', () => stream ? stopCamera() : startCamera(settings.deviceId));
  cameraSel.addEventListener('change', () => { settings.deviceId = cameraSel.value; startCamera(cameraSel.value); });

  // ---- 結果の処理 ----
  function isWebUrl(text) {
    try {
      const u = new URL(text.trim());
      return u.protocol === 'http:' || u.protocol === 'https:';
    } catch { return false; }
  }

  function handleResult(text) {
    const now = Date.now();
    if (text === lastText && now - lastTime < DUP_WINDOW_MS) return;
    lastText = text; lastTime = now;
    showResult(text);
    addHistory(text);
    viewport.classList.add('hit');
    setTimeout(() => viewport.classList.remove('hit'), 400);
    if (autoCopy.checked) copyText(text);
  }

  function showResult(text) {
    currentText = text;
    resultCard.hidden = false;
    resultText.textContent = text;
    openBtn.hidden = !isWebUrl(text);
    toast.textContent = '';
  }

  async function copyText(text) {
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      ta.remove();
    }
    flash(ok ? 'クリップボードにコピーしました' : 'コピーできませんでした（「コピー」ボタンを押してください）');
  }

  function openUrl(text) {
    if (isWebUrl(text)) window.open(text.trim(), '_blank', 'noopener,noreferrer');
  }

  let toastTimer = null;
  function flash(msg) {
    toast.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.textContent = ''; }, 2500);
  }
  function setStatus(msg) { statusEl.textContent = msg; }

  copyBtn.addEventListener('click', () => copyText(currentText));
  openBtn.addEventListener('click', () => openUrl(currentText));

  // ---- 履歴 ----
  const HISTORY_MAX = 100;
  const joinCopyBtn = $('joinCopy'), selectAllBtn = $('selectAll'), historyTools = $('historyTools');
  let history = loadJSON(HISTORY_KEY, []);
  let selected = new Set(); // 選択中の履歴エントリ（オブジェクトそのもの）
  let lastPicked = -1, shiftHeld = false;
  // チェックボックスの change イベントには shiftKey が無いので、直前の操作から拾う
  for (const type of ['pointerdown', 'keydown']) {
    document.addEventListener(type, (e) => { shiftHeld = e.shiftKey; }, true);
  }

  function addHistory(text) {
    history = [{ text, time: Date.now() }, ...history.filter(h => h.text !== text)].slice(0, HISTORY_MAX);
    saveJSON(HISTORY_KEY, history);
    renderHistory();
  }
  function renderHistory() {
    selected = new Set(history.filter(h => selected.has(h)));
    historyEl.innerHTML = '';
    historyEmpty.hidden = history.length > 0;
    historyTools.hidden = history.length === 0;
    history.forEach((h, i) => {
      const li = document.createElement('li');
      const pick = document.createElement('label');
      pick.className = 'pick';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = selected.has(h);
      cb.addEventListener('change', () => pickHistory(i, cb.checked));
      const span = document.createElement('span');
      span.className = 'text'; span.textContent = h.text; span.title = h.text;
      pick.append(cb, span);
      const time = document.createElement('span');
      time.className = 'time'; time.textContent = new Date(h.time).toLocaleString('ja-JP');
      const copy = document.createElement('button');
      copy.textContent = 'コピー';
      copy.addEventListener('click', () => { showResult(h.text); copyText(h.text); });
      li.append(pick, time, copy);
      if (isWebUrl(h.text)) {
        const open = document.createElement('button');
        open.textContent = '開く';
        open.addEventListener('click', () => openUrl(h.text));
        li.append(open);
      }
      historyEl.appendChild(li);
    });
    updateHistoryTools();
  }
  // Shift を押しながらなら、前回クリックした項目からの範囲をまとめて同じ状態にする
  function pickHistory(index, checked) {
    const from = shiftHeld && lastPicked >= 0 ? Math.min(lastPicked, index) : index;
    const to = shiftHeld && lastPicked >= 0 ? Math.max(lastPicked, index) : index;
    for (let i = from; i <= to; i++) {
      if (checked) selected.add(history[i]); else selected.delete(history[i]);
    }
    lastPicked = index;
    if (from !== to) renderHistory(); else updateHistoryTools();
  }
  function updateHistoryTools() {
    const n = selected.size;
    joinCopyBtn.disabled = n === 0;
    joinCopyBtn.textContent = n ? `選択した ${n} 件を結合してコピー` : '選択した項目を結合してコピー';
    selectAllBtn.textContent = n && n === history.length ? '選択を解除' : 'すべて選択';
  }
  selectAllBtn.addEventListener('click', () => {
    selected = selected.size === history.length ? new Set() : new Set(history);
    lastPicked = -1;
    renderHistory();
  });
  // 履歴は新しい順に並んでいるので、読み取った時刻の古い順に並べ直してから繋げる
  joinCopyBtn.addEventListener('click', () => {
    const joined = history.filter(h => selected.has(h))
      .sort((a, b) => a.time - b.time)
      .map(h => h.text).join('');
    if (!joined) return;
    showResult(joined);
    copyText(joined);
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  $('clearHistory').addEventListener('click', () => {
    if (!history.length || !confirm('履歴をすべて消去しますか？')) return;
    history = []; selected = new Set(); lastPicked = -1;
    saveJSON(HISTORY_KEY, history); renderHistory();
  });

  // ---- 画像から読み取り ----
  async function decodeImageFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const text = await decodeSource(bmp, Math.round(bmp.width * scale), Math.round(bmp.height * scale));
      if (text) { lastText = ''; handleResult(text); setStatus('画像から読み取りました'); }
      else setStatus('画像からQRコードが見つかりませんでした');
    } catch (e) {
      setStatus('画像を読み込めませんでした: ' + e.message);
    }
  }
  $('file').addEventListener('change', (e) => { decodeImageFile(e.target.files[0]); e.target.value = ''; });
  const drop = $('drop');
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); drop.classList.remove('over');
    decodeImageFile(e.dataTransfer.files[0]);
  });
  document.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) decodeImageFile(item.getAsFile());
  });

  // ---- QRコード生成 ----
  const genInput = $('genInput'), genSize = $('genSize'), genLevel = $('genLevel');
  const genOutput = $('genOutput'), genCanvas = $('genCanvas'), genMessage = $('genMessage');
  const genToast = $('genToast'), genPager = $('genPager'), genPage = $('genPage');
  const genPrev = $('genPrev'), genNext = $('genNext');
  // アニメーション: 最大 50 コマ・全体で約 1.5 秒（1コマ 30〜80ms）
  const ANIM_MAX_FRAMES = 50, ANIM_DURATION_MS = 1500, ANIM_MIN_STEP_MS = 30, ANIM_MAX_STEP_MS = 80;
  const MAX_PARTS = 50; // 分割しすぎると読み取りも履歴の管理も大変なので上限を設ける
  let genTimer = null, animTimer = null, finalQR = null;
  let parts = [], partQRs = [], page = 0; // 分割した文字列（文字の配列）と各QR、表示中の番号

  function chunkSize() {
    const n = Math.floor(Number(genChunk.value));
    return n > 0 ? n : 500;
  }
  // Array.from で文字単位に分ける（絵文字やサロゲートペアを途中で切らない）
  function splitText(text) {
    const chars = Array.from(text);
    const n = chunkSize();
    if (!genSplit.checked || chars.length <= n) return [chars];
    const out = [];
    for (let i = 0; i < chars.length; i += n) out.push(chars.slice(i, i + n));
    return out;
  }

  function makeQR(text) {
    const qr = qrcode(0, genLevel.value); // 0 = 文字数に合わせて自動でバージョン選択
    qr.addData(text);
    qr.make();
    return qr;
  }

  function generateQR(animate = false) {
    stopAnimation();
    const text = genInput.value;
    genMessage.textContent = '';
    if (!text) { genOutput.hidden = true; return; }
    if (typeof qrcode !== 'function') {
      genMessage.textContent = 'vendor/qrcode-generator.js が読み込めませんでした。';
      return;
    }
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']; // 日本語を正しく扱う
    const split = splitText(text);
    if (split.length > MAX_PARTS) {
      genOutput.hidden = true;
      genMessage.textContent = `分割すると ${split.length} 枚になります（上限 ${MAX_PARTS} 枚）。1枚あたりの文字数を増やしてください。`;
      return;
    }
    try {
      partQRs = split.map(chars => makeQR(chars.join('')));
    } catch {
      genOutput.hidden = true;
      genMessage.textContent = genSplit.checked
        ? '1枚あたりの文字数が多すぎてQRコードにできません。文字数を減らすか、誤り訂正レベルを下げてください。'
        : '文字列が長すぎてQRコードにできません。「長い文字列を分割する」を使うか、誤り訂正レベルを下げてください。';
      return;
    }
    parts = split;
    page = Math.min(page, parts.length - 1);
    finalQR = partQRs[page];
    genOutput.hidden = false;
    updatePager();
    if (animate) animateQR(parts[page]);
    else drawQR(finalQR);
  }

  function updatePager() {
    genPager.hidden = parts.length <= 1;
    if (genPager.hidden) return;
    const start = parts.slice(0, page).reduce((sum, p) => sum + p.length, 0);
    genPage.textContent = `${page + 1} / ${parts.length}（${start + 1}〜${start + parts[page].length}文字目）`;
    genPrev.disabled = page === 0;
    genNext.disabled = page === parts.length - 1;
  }
  function showPage(next) {
    if (next < 0 || next >= parts.length) return;
    stopAnimation();
    page = next;
    finalQR = partQRs[page];
    drawQR(finalQR);
    updatePager();
  }
  genPrev.addEventListener('click', () => showPage(page - 1));
  genNext.addEventListener('click', () => showPage(page + 1));
  // キーボードの ← / → でも切り替え（文字入力中のカーソル移動や Alt+← の「戻る」は邪魔しない）
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (genOutput.hidden || genPager.hidden || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.target.closest?.('textarea, select, input:not([type="checkbox"])') || e.target.isContentEditable) return;
    e.preventDefault();
    showPage(page + (e.key === 'ArrowRight' ? 1 : -1));
  });

  // 先頭から1文字ずつ読み込んだ途中の文字列で QR コードを描き、最後に完成形を描く。
  // 長い文字列はコマ数を抑えるため、1コマで複数文字進める。
  function animateQR(chars) {
    const frames = Math.min(chars.length, ANIM_MAX_FRAMES);
    const delay = Math.min(ANIM_MAX_STEP_MS, Math.max(ANIM_MIN_STEP_MS, ANIM_DURATION_MS / frames));
    let frame = 0;
    const step = () => {
      frame++;
      if (frame >= frames) { animTimer = null; drawQR(finalQR); return; }
      drawQR(makeQR(chars.slice(0, Math.round(chars.length * frame / frames)).join('')));
      animTimer = setTimeout(step, delay);
    };
    step();
  }
  function stopAnimation() { clearTimeout(animTimer); animTimer = null; }
  // 保存・コピー時は途中のコマではなく完成形を使う
  function finishAnimation() {
    if (!animTimer) return;
    stopAnimation();
    drawQR(finalQR);
  }

  function drawQR(qr) {
    const count = qr.getModuleCount();
    const quiet = 4; // 周囲の余白（規格上 4 モジュール）
    const size = Number(genSize.value);
    const cell = Math.max(1, Math.floor(size / (count + quiet * 2)));
    const total = cell * (count + quiet * 2);
    genCanvas.width = genCanvas.height = total;
    const g = genCanvas.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, total, total);
    g.fillStyle = '#000000';
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) g.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
      }
    }
  }
  // アニメーションは貼り付け時（とサイズ等の変更時）だけ。手で打っているときは即座に完成形を描く
  genInput.addEventListener('input', (e) => {
    clearTimeout(genTimer);
    page = 0; // 文字列が変わったら1枚目から
    if (e.inputType === 'insertFromPaste') generateQR(genAnimate.checked);
    else genTimer = setTimeout(generateQR, 150);
  });
  genSplit.addEventListener('change', () => { page = 0; persistSettings(); generateQR(); });
  genChunk.addEventListener('input', () => {
    clearTimeout(genTimer);
    genTimer = setTimeout(() => { page = 0; persistSettings(); generateQR(); }, 300);
  });
  genSize.addEventListener('change', () => generateQR(genAnimateOnOption.checked));
  genLevel.addEventListener('change', () => generateQR(genAnimateOnOption.checked));
  for (const el of [genAnimate, genAnimateOnOption]) {
    el.addEventListener('change', () => { persistSettings(); finishAnimation(); });
  }
  // ペースト時に読み取りへ回さない（テキスト入力中の貼り付け）
  genInput.addEventListener('paste', (e) => e.stopPropagation());

  function genFlash(msg) {
    genToast.textContent = msg;
    setTimeout(() => { genToast.textContent = ''; }, 2500);
  }
  $('genDownload').addEventListener('click', () => {
    finishAnimation();
    const a = document.createElement('a');
    a.href = genCanvas.toDataURL('image/png');
    a.download = parts.length > 1 ? `qrcode-${page + 1}of${parts.length}.png` : 'qrcode.png';
    a.click();
  });
  $('genCopy').addEventListener('click', async () => {
    finishAnimation();
    try {
      const blob = await new Promise(res => genCanvas.toBlob(res, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      genFlash('画像をクリップボードにコピーしました');
    } catch {
      genFlash('このブラウザでは画像をコピーできません。「PNGで保存」を使ってください');
    }
  });

  // ---- 起動 ----
  renderHistory();
  initDetector();
  if (typeof jsQR !== 'function') setStatus('vendor/jsQR.js が読み込めませんでした。フォルダごと配置してください。');
  window.addEventListener('pagehide', stopCamera);
})();
</script>
</body>
</html>
